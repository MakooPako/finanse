<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1420">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Finanse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="skin-neon.css">
<link rel="stylesheet" href="skin-sunset.css">
<link rel="stylesheet" href="skin-racer.css">
<script src="skin.js"></script>
</head>
<body class="booting">
<header class="appbar"><div class="ab-in">
  <div class="ab-title"><b>Finanse</b><span id="abSub">wczytuję dane…</span></div>
  <nav class="tabbar" id="tabbar" aria-label="Sekcje">
    <button type="button" data-tab="teraz"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg><span>Teraz</span></button>
    <button type="button" data-tab="wydatki"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg><span>Wydatki</span></button>
    <button type="button" class="tb-add" data-entry-new aria-label="Dodaj wpis"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Dodaj</span></button>
    <button type="button" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M9 3.5v4M15 3.5v4"/></svg><span>Plan</span></button>
    <button type="button" data-tab="oszczednosci"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 7.5V5.8A1.8 1.8 0 0 0 15.7 4H6.3A2.3 2.3 0 0 0 4 6.3v11.2A2.5 2.5 0 0 0 6.5 20h11A2.5 2.5 0 0 0 20 17.5V10a2.5 2.5 0 0 0-2.5-2.5H6.2A2.2 2.2 0 0 1 4 5.8"/><path d="M15.5 14h1"/></svg><span>Oszczędności</span></button>
  </nav>
  <div class="ab-act">
    <button type="button" class="ib" data-refresh aria-label="Odśwież dane"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4.2h-4.2"/></svg></button>
    <button type="button" class="ib ib-log" data-tab="wpisy" aria-label="Wpisy: historia i wyszukiwanie"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6.5H20M9.5 12H20M9.5 17.5H20"/><path d="M5 6.5h.01M5 12h.01M5 17.5h.01" stroke-width="2.6"/></svg></button>
    <a class="ib" id="abSheet" href="#" target="_blank" rel="noopener" aria-label="Otwórz arkusz" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M4 9.5h16M4 15h16M10 9.5V20"/></svg></a>
    <button type="button" class="ib ib-sec" data-tab="urzadzenia" aria-label="Ustawienia: urządzenia, przypomnienia, kolory"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.7 7.7 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.7 7.7 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.7 7.7 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.7 7.7 0 0 0 2.6-1.5l2.4 1 2-3.4z"/></svg><i class="dot" aria-hidden="true"></i></button>
    <button type="button" class="ab-add" data-entry-new><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Dodaj wpis</button>
  </div>
</div></header>
<div class="sync" id="sync" role="status" aria-live="polite" hidden></div>
<div class="layout"><main class="wrap" id="app"><div class="boot" aria-busy="true">
  <div class="sk sk-hero"></div><div class="sk"></div><div class="sk"></div></div></main><aside class="side" id="side" aria-label="Ostatnie wpisy"></aside></div>

<button class="fab" id="fab" type="button" aria-haspopup="dialog"><span aria-hidden="true">+</span>Dodaj wpis</button>
<div class="sheet-bg" id="sheetBg" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-head"><h2 id="sheetTitle">Nowy wpis</h2><button type="button" class="x" id="sheetClose" aria-label="Zamknij">✕</button></div>
  <div class="pay-ctx" id="payCtx" hidden></div>
  <div class="seg" id="kindSeg" role="group" aria-label="Rodzaj wpisu">
    <button type="button" data-kind="expense" aria-pressed="true">Wydatek</button>
    <button type="button" data-kind="income" aria-pressed="false">Wpływ</button>
  </div>
  <div id="expensePick">
    <div class="quick" id="quick" role="group" aria-label="Szybki wybór kategorii"></div>
    <div id="otherPick" hidden><p class="hint-avg">Do którego bloku dopisać? Kwota trafi do jego kolumny Inne lub Różne.</p><div class="chips" id="otherChips" role="group" aria-label="Blok"></div></div>
    <label class="field"><span>Inna kategoria</span><select id="catSelect"></select></label>
  </div>
  <div id="incomePick" hidden>
    <div class="quick" id="inflowQuick" role="group" aria-label="Rodzaj wpływu"></div>
    <p class="hint-avg" id="inflowNote"></p>
  </div>
  <div class="dates" role="group" aria-label="Data zakupu">
    <button type="button" data-ago="0">Dziś</button><button type="button" data-ago="1">Wczoraj</button><button type="button" data-next hidden>Następny miesiąc</button>
    <input type="date" id="date" aria-label="Data zakupu">
  </div>
  <div class="month-hint" id="monthHint"></div>
  <label class="amount"><span class="sr">Kwota w złotych</span><input id="amount" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="0"><em>zł</em></label>
  <div class="amount-hint" id="amountHint">Kilka kwot naraz? Wpisz np. 12,50+30.</div>
  <label class="field"><span>Opis (nieobowiązkowy)</span><input id="desc" maxlength="200" autocomplete="off" placeholder="np. Biedronka, pizza, Orlen"></label>
  <label class="check"><input type="checkbox" id="unpaid"><span>Jeszcze niezapłacone</span></label>
  <label class="check" id="newPriceRow" hidden><input type="checkbox" id="newPrice"><span>To nowa cena: zapamiętaj ją na kolejne miesiące</span></label>
  <p class="err" id="err" role="alert"></p>
  <p class="edit-note" id="editNote" hidden></p>
  <button class="save" id="save" type="button" disabled>Wybierz kategorię i wpisz kwotę</button>
  <button class="danger" id="delEntry" type="button" hidden>Usuń wpis</button>
  <div class="recent" id="recent"></div>
</section>
<section class="sheet" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-head"><h2 id="detailTitle">Miesiąc</h2><button type="button" class="x" data-close aria-label="Zamknij">✕</button></div>
  <div id="detailBody"></div>
</section>
<section class="sheet" id="limitSheet" role="dialog" aria-modal="true" aria-labelledby="limitTitle" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-head"><h2 id="limitTitle">Nowy limit</h2><button type="button" class="x" data-close aria-label="Zamknij">✕</button></div>
  <label class="field"><span>Kategoria</span><select id="limBlock"></select></label>
  <div class="chips" id="limCols" role="group" aria-label="Zakres limitu"></div>
  <label class="field"><span>Nazwa</span><input id="limName" maxlength="60" autocomplete="off"></label>
  <label class="amount"><span class="sr">Limit miesięczny w złotych</span><input id="limAmount" inputmode="decimal" autocomplete="off" placeholder="0"><em>zł / mies.</em></label>
  <div class="hint-avg" id="limAvg"></div>
  <label class="check" id="limActiveRow"><input type="checkbox" id="limActive" checked><span>Limit aktywny</span></label>
  <p class="err" id="limErr" role="alert"></p>
  <button class="save" id="limSave" type="button">Zapisz limit</button>
  <button class="danger" id="limDelete" type="button" hidden>Usuń limit</button>
</section>
<section class="sheet" id="paySheet" role="dialog" aria-modal="true" aria-labelledby="payTitle" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-head"><h2 id="payTitle">Nowa płatność</h2><button type="button" class="x" data-close aria-label="Zamknij">✕</button></div>
  <label class="field"><span>Nazwa</span><input id="payName" maxlength="60" autocomplete="off" placeholder="np. Czynsz TBS, Spotify"></label>
  <label class="check pay-auto"><input type="checkbox" id="payAuto"><span>Pobiera się samo z konta (subskrypcja)</span></label>
  <div class="two-col">
    <label class="field"><span>Blok</span><select id="payBlock"></select></label>
    <label class="field"><span>Kolumna</span><select id="payCol"></select></label>
  </div>
  <div class="two-col">
    <label class="field" id="payDayRow"><span>Dzień płatności</span><input id="payDay" class="num-in" type="number" min="1" max="31" inputmode="numeric"></label>
    <label class="field" id="payNextRow" hidden><span>Najbliższe pobranie</span><input id="payNext" class="num-in" type="date"></label>
    <label class="field"><span>Kwota (puste = jak ostatnio)</span><input id="payAmount" class="num-in" inputmode="decimal" autocomplete="off"></label>
  </div>
  <div class="field"><span>Jak często</span><div class="chips" id="payEvery" role="group" aria-label="Jak często"></div></div>
  <p class="hint-avg" id="payNextHint"></p>
  <label class="field" id="payFromRow"><span>Najbliższy termin (miesiąc)</span><input id="payFrom" class="num-in" type="month"></label>
  <div class="two-col" id="payExtraRow">
    <label class="field"><span>Dzień faktury (opcjonalnie)</span><input id="payInvoice" class="num-in" type="number" min="1" max="31" inputmode="numeric" placeholder="np. 26"></label>
    <label class="field"><span>Nadpłata (zł)</span><input id="payCredit" class="num-in" inputmode="decimal" autocomplete="off" placeholder="0"></label>
  </div>
  <p class="hint-avg" id="payInvoiceHint"></p>
  <p class="err" id="payErr" role="alert"></p>
  <button class="save" id="paySave" type="button">Zapisz płatność</button>
  <button class="danger" id="payDelete" type="button" hidden>Usuń płatność</button>
</section>
<section class="sheet" id="formSheet" role="dialog" aria-modal="true" aria-labelledby="formTitle" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-head"><h2 id="formTitle"></h2><button type="button" class="x" data-close aria-label="Zamknij">✕</button></div>
  <div id="formBody"></div>
  <p class="err" id="formErr" role="alert"></p>
  <button class="save" id="formSave" type="button"></button>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
