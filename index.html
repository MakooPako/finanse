<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1420">
<meta name="robots" content="noindex, nofollow">
<title>Finanse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Tryb nocny na stałe: granatowe tło, przygaszony tekst, kolory serii pod ciemną powierzchnię */
  :root {
    color-scheme: dark;
    --bg: #0d1420;
    --surface: #131c2a;
    --surface-2: #192436;
    --line: #223047;
    --grid: #1d2a3d;
    --text: #e2e8f0;
    --text-2: #a6b2c3;
    --muted: #8794aa;
    --income: #3987e5;
    --expense: #d95926;
    --left: #199e70;
    --deficit: #d03b3b;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #e05a5a;
    --focus: #6da7ec;
    --r-lg: 18px;
    --r-sm: 10px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); }
  body {
    margin: 0; color: var(--text);
    font: 15px/1.5 "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-feature-settings: "tnum" 1;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
  a { color: var(--text-2); text-underline-offset: 3px; }
  a:hover { color: var(--text); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* --- nagłówek i zdanie główne --- */
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; color: var(--muted); font-size: 14px; }
  .top b { color: var(--text-2); font-weight: 600; font-size: 14px; }
  .top .meta { display: flex; gap: 14px; }
  .top { flex-wrap: wrap; row-gap: 6px; }
  .top .ttl { display: flex; flex-wrap: wrap; gap: 0 12px; align-items: baseline; }
  .top .ttl > *, .top .meta > * { white-space: nowrap; }
  .lead { font-size: clamp(22px, 4.6vw, 32px); line-height: 1.28; font-weight: 500; letter-spacing: -0.015em; margin: 14px 0 20px; max-width: 30ch; color: var(--text-2); text-wrap: balance; }
  .lead strong { color: var(--text); font-weight: 700; }

  /* --- panel z wykresem głównym --- */
  .panel { background: var(--surface); border-radius: var(--r-lg); padding: 18px 18px 14px; }
  .panel + .panel, .cols { margin-top: 14px; }
  .panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; color: var(--text); }
  .panel .desc { font-size: 14px; color: var(--muted); margin: 0 0 14px; }
  .hero { background: linear-gradient(180deg, var(--surface) 0%, #111a27 100%); padding-bottom: 10px; }
  .chart { position: relative; height: 400px; margin: 0 -6px; touch-action: pan-y; }
  @media (max-width: 560px) { .chart { height: 330px; } }
  .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .tip { position: absolute; top: 6px; pointer-events: none; background: rgba(13,20,32,.94); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 8px 11px; font-size: 14px; min-width: 168px; opacity: 0; transition: opacity .15s; z-index: 2; }
  .tip.on { opacity: 1; }
  .tip .t { color: var(--text); font-weight: 600; margin-bottom: 4px; }
  .tip .t em { font-style: normal; color: var(--muted); font-weight: 500; }
  .tip .r { display: flex; justify-content: space-between; gap: 14px; color: var(--text-2); }
  .tip .r span:last-child { color: var(--text); font-weight: 600; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }
  .sw.line { height: 3px; border-radius: 2px; vertical-align: 3px; width: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; color: var(--text-2); margin-top: 8px; padding-left: 2px; }
  .legend .dash { display: inline-block; width: 16px; border-top: 2px dashed var(--muted); margin-right: 7px; vertical-align: 3px; }

  /* --- liczby pod wykresem --- */
  .figures { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
  .figures > div { padding: 0 14px; border-left: 1px solid var(--line); }
  .figures > div:first-child { border-left: 0; padding-left: 2px; }
  .figures .k, .figures .v, .figures .s { display: block; }
  .figures .k { font-size: 13.5px; color: var(--muted); }
  .figures .v { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; margin: 2px 0; }
  .figures .s { font-size: 13.5px; color: var(--text-2); }
  @media (max-width: 560px) {
    .figures { grid-template-columns: 1fr; gap: 12px; }
    .figures > div { border-left: 0; padding: 0 2px; display: grid; grid-template-columns: 1fr auto; column-gap: 12px; }
    .figures .v { grid-row: span 2; align-self: center; font-size: 19px; margin: 0; }
  }

  /* --- alerty --- */
  .alerts { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }
  .alerts li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; background: var(--surface); border-radius: var(--r-sm); padding: 11px 14px; font-size: 14px; color: var(--text-2); }
  .alerts li b { color: var(--text); font-weight: 600; }
  .ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--bg); margin-top: 1px; }
  .ico.critical { background: var(--critical); } .ico.warning { background: var(--warning); } .ico.good { background: var(--good); }

  /* --- kolumny --- */
  .cols { display: grid; gap: 14px; grid-template-columns: 1fr; }
  .cols > * { min-width: 0; }
  @media (min-width: 860px) { .cols { grid-template-columns: 1fr 1fr; } .cols > .panel + .panel { margin-top: 0; } }

  /* --- limity --- */
  .limit { padding: 12px 0; border-top: 1px solid var(--line); }
  .limit:first-of-type { border-top: 0; padding-top: 4px; }
  .limit .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .limit .name { font-weight: 600; }
  .limit .amt { color: var(--text-2); font-size: 14px; }
  .limit .amt b { color: var(--text); }
  .state { font-size: 13.5px; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; margin-top: 2px; }
  .state i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .track { position: relative; height: 8px; background: var(--surface-2); border-radius: 99px; margin: 9px 0 8px; overflow: hidden; }
  .track > span { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .track > u { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bg); }
  .months { display: flex; gap: 3px; align-items: flex-end; height: 26px; }
  .months span { flex: 1; border-radius: 3px 3px 1px 1px; min-height: 3px; background: #2c3b52; }
  .months span.warn { background: #8a6a1f; } .months span.over { background: #8f3434; }
  .months span.now { outline: 1.5px solid var(--text-2); outline-offset: 1px; }
  .limit .foot { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; }

  /* --- terminy --- */
  .due { padding: 12px 0; border-top: 1px solid var(--line); }
  .due:first-of-type { border-top: 0; padding-top: 4px; }
  .due .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .due .when { font-size: 14px; color: var(--text-2); }
  .due .note { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .due .save { font-size: 14px; color: var(--text-2); margin-top: 6px; }
  .due .save b { color: var(--text); }
  .rates { font-size: 14px; color: var(--text-2); border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
  .rates div { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }

  /* --- struktura wydatków --- */
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px 6px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { border: 0; background: var(--surface-2); color: var(--text-2); padding: 6px 12px; border-radius: 99px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .tabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 600; }
  .tabs-wrap { position: relative; }
  .tabs-arrow { position: absolute; top: 0; bottom: 8px; width: 52px; border: 0; padding: 0; cursor: pointer; z-index: 1;
    display: flex; align-items: center; color: var(--text); font: inherit; font-size: 20px; line-height: 1; transition: opacity .15s; }
  .tabs-arrow span { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); }
  .tabs-arrow:hover span { background: var(--line); }
  .tabs-arrow.l { left: -2px; justify-content: flex-start; background: linear-gradient(90deg, var(--surface) 55%, transparent); }
  .tabs-arrow.r { right: -2px; justify-content: flex-end; background: linear-gradient(270deg, var(--surface) 55%, transparent); }
  .tabs-arrow[data-off] { opacity: 0; pointer-events: none; }
  details.cat { border-top: 1px solid var(--line); }
  details.cat:first-of-type { border-top: 0; }
  details.cat summary { list-style: none; cursor: pointer; padding: 10px 0; }
  details.cat summary::-webkit-details-marker { display: none; }
  .cat .row { display: flex; justify-content: space-between; gap: 8px; }
  .cat .row small { color: var(--muted); font-size: 13.5px; margin-left: 6px; }
  .cat .row .chev { color: var(--muted); display: inline-block; transition: transform .2s; margin-left: 6px; font-size: 11px; }
  details[open] .chev { transform: rotate(90deg); }
  .cat .bar { height: 6px; border-radius: 99px; background: var(--surface-2); margin-top: 7px; overflow: hidden; }
  .cat .bar span { display: block; height: 100%; border-radius: 99px; background: var(--income); transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .cat .bar span.hot { background: var(--expense); }
  .cat .subs { padding: 0 0 10px 12px; font-size: 14px; color: var(--text-2); }
  .cat .subs div { display: flex; justify-content: space-between; padding: 2px 0; }
  .total { font-size: 14px; color: var(--muted); margin-top: 6px; }

  /* --- prognoza --- */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 13.5px; color: var(--muted); font-weight: 500; padding: 0 6px 8px; }
  td { padding: 9px 6px; border-top: 1px solid var(--line); vertical-align: top; color: var(--text-2); }
  td:first-child { color: var(--text); }
  td.n, th.n { text-align: right; }
  td.num { white-space: normal; }
  @media (max-width: 480px) { table { font-size: 14px; } th, td { padding-left: 4px; padding-right: 4px; } }
  td .items { font-size: 13px; color: var(--muted); margin-top: 1px; }
  td.left { color: var(--text); font-weight: 700; }
  td.left i { display: block; margin: 5px 0 0 auto; height: 3px; border-radius: 2px; background: var(--left); opacity: .55; }
  td.left.neg { color: var(--critical); }
  td.left.neg i { background: var(--deficit); }
  .now { font-size: 12.5px; color: var(--muted); margin-left: 6px; }

  /* --- do uzupełnienia, stopka --- */
  ul.plain { margin: 0; padding-left: 18px; font-size: 14px; color: var(--text-2); }
  ul.plain li { margin: 4px 0; }
  ul.plain li.warn { color: var(--muted); }
  footer { margin-top: 22px; font-size: 13.5px; color: var(--muted); line-height: 1.65; max-width: 75ch; }

  /* --- dziennik --- */
  .resume { margin: -8px 0 16px; font-size: 14px; color: var(--text-2); }
  .resume b { color: var(--text); }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: grid; grid-template-columns: 52px 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .log li:first-child { border-top: 0; }
  .log .d { color: var(--muted); font-size: 13.5px; }
  .log .c { min-width: 0; }
  .log .c b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log .c small { display: block; color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log .c small.tag { color: var(--warning); }
  .log .a { font-weight: 700; }
  .log .u { font: inherit; font-size: 13.5px; background: none; border: 1px solid var(--line); color: var(--text-2); border-radius: 99px; padding: 4px 10px; cursor: pointer; min-width: 74px; }
  .log .u[data-armed] { border-color: var(--critical); color: var(--text); background: rgba(224,90,90,.15); }
  .log .u.muted { border: 0; color: var(--muted); cursor: default; text-align: right; }
  .log li.undone .c b, .log li.undone .a { color: var(--muted); text-decoration: line-through; font-weight: 500; }
  .empty-log { color: var(--text-2); font-size: 14px; margin: 0; }

  /* --- przycisk dodawania --- */
  .fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 20; border: 0; border-radius: 99px;
    background: #2a6fd0; color: #fff; font: inherit; font-weight: 700; font-size: 15px; padding: 14px 20px 14px 16px;
    box-shadow: 0 10px 28px rgba(0,0,0,.45); cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .fab span { font-size: 22px; line-height: 0; font-weight: 500; }
  .wrap { padding-bottom: 96px; }

  /* --- formularz (arkusz od dołu) --- */
  .sheet-bg { position: fixed; inset: 0; background: rgba(5,9,15,.62); z-index: 30; opacity: 0; transition: opacity .25s; }
  .sheet-bg.open { opacity: 1; }
  .sheet { overflow-x: hidden; position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 94vh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(102%); transition: transform .3s cubic-bezier(.2,.8,.2,1); max-width: 560px; margin: 0 auto; }
  .sheet.open { transform: translateY(0); }
  @media (min-width: 700px) { .sheet { bottom: 24px; border-radius: 22px; max-height: calc(100vh - 48px); } }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 8px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .sheet-head h2 { margin: 0; font-size: 18px; }
  .x { background: var(--surface-2); border: 0; color: var(--text-2); width: 36px; height: 36px; border-radius: 50%; font-size: 15px; cursor: pointer; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
  .seg button { border: 0; background: none; color: var(--text-2); font: inherit; font-weight: 600; padding: 9px; border-radius: 9px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }
  .quick { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
  .quick button { border: 1.5px solid transparent; background: var(--surface-2); color: var(--text); font: inherit; font-size: 14px; font-weight: 600;
    border-radius: 14px; padding: 10px 4px 9px; min-height: 68px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .quick button i { font-style: normal; font-size: 22px; line-height: 1; }
  .quick button[aria-pressed="true"] { border-color: var(--income); background: #1d3352; }
  .field { display: block; margin-top: 12px; }
  .field > span { display: block; font-size: 13.5px; color: var(--muted); margin-bottom: 5px; }
  .field select, .field input { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 12px; }
  .field select.picked { border-color: var(--income); }
  .income-note { font-size: 14px; color: var(--text-2); background: var(--bg); border-radius: 12px; padding: 12px; margin: 0; }
  .amount { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px; }
  .amount:focus-within { border-color: var(--income); }
  .amount input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text); font: inherit; font-size: 34px; font-weight: 700; padding: 4px 0; }
  .amount em { font-style: normal; color: var(--muted); font-size: 18px; }
  .amount-hint, .month-hint { font-size: 13.5px; color: var(--muted); min-height: 18px; margin-top: 5px; }
  .dates { display: flex; gap: 8px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .dates button { border: 0; background: var(--surface-2); color: var(--text-2); font: inherit; font-size: 14px; padding: 9px 14px; border-radius: 99px; cursor: pointer; }
  .dates button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 700; }
  .dates input { flex: 1; min-width: 150px; font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .check { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-size: 15px; color: var(--text-2); cursor: pointer; }
  .check input { width: 20px; height: 20px; accent-color: var(--warning); }
  .err { color: #ff9b9b; font-size: 14px; margin: 12px 0 0; min-height: 0; }
  .err:empty { display: none; }
  button.save { position: sticky; bottom: 0; box-shadow: 0 -10px 18px var(--surface); width: 100%; margin-top: 14px; border: 0; border-radius: 14px; padding: 15px; font: inherit; font-size: 16px; font-weight: 700; color: #fff; background: #2a6fd0; cursor: pointer; }
  button.save:disabled { background: var(--surface-2); color: var(--muted); cursor: default; }
  .recent { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 14px; color: var(--muted); }
  .recent div { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .recent b { color: var(--text-2); font-weight: 600; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* --- komunikat po zapisie --- */
  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); z-index: 40;
    width: min(520px, calc(100% - 24px)); background: #e2e8f0; color: #0d1420; border-radius: 14px; padding: 12px 14px; font-size: 14px;
    display: flex; gap: 12px; align-items: center; justify-content: space-between; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast small { display: block; color: #3d4a5c; margin-top: 2px; }
  .toast button { border: 0; background: #0d1420; color: #e2e8f0; font: inherit; font-weight: 700; font-size: 14px; padding: 8px 12px; border-radius: 99px; cursor: pointer; white-space: nowrap; }

  /* --- układ: historia wpisów z prawej na szerokim ekranie --- */
  .side { display: none; }
  @media (min-width: 1200px) {
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; max-width: 1500px; margin: 0 auto; padding: 0 22px; }
    .layout .wrap { max-width: none; padding-left: 0; padding-right: 0; }
    .side { display: block; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 20px 0 40px; scrollbar-width: thin; }
    .side .panel { min-height: calc(100vh - 60px); }
    .fab { display: none; }
    .side-add { width: 100%; margin: 4px 0 14px; border: 0; border-radius: 12px; background: #2a6fd0; color: #fff; font: inherit; font-weight: 700; padding: 12px; cursor: pointer; }
  }

  /* --- panel podatku --- */
  .tax .row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--text-2); }
  .tax .row b { color: var(--text); }
  .tax .track > i { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--warning); }
  .tax-msg { font-size: 14px; color: var(--text-2); margin: 10px 0 0; line-height: 1.55; }
  .tax-msg b { color: var(--text); }

  /* --- limity: edycja --- */
  .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .btn-sm { border: 1px solid var(--line); background: none; color: var(--text); font: inherit; font-size: 14px; font-weight: 600; border-radius: 99px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .btn-sm:hover { border-color: var(--text-2); }
  .edit { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13.5px; cursor: pointer; padding: 2px 0 2px 8px; text-decoration: underline; text-underline-offset: 3px; }
  .limit.off .name, .limit.off .amt { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

  /* --- przełącznik widoku wykresu, struktura --- */

  .pay-btn { border: 0; border-radius: 99px; padding: 7px 14px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; background: #2a6fd0; color: #fff; }

  .pay.st-overdue .stripe, .pay.st-urgent .stripe { background: var(--critical); }

  .pay-btn.ghost { padding: 6px 12px; font-size: 13.5px; }

  /* --- symulacja --- */
  .sav-points { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; margin: 4px 0 14px; }

  .sav-chart { position: relative; height: 230px; margin: 0 -6px; }

  /* --- legenda z wyborem bloku --- */
  .legend button { border: 0; background: none; color: inherit; font: inherit; padding: 2px 0; cursor: pointer; }

  /* --- start: pasek synchronizacji i ekran ładowania --- */
  .sync { position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; justify-content: center;
    padding: 8px 16px; font-size: 13.5px; background: #10213a; color: var(--text-2); border-bottom: 1px solid var(--line); }

  body.booting .fab { display: none; }
  .linkish { border: 0; background: none; padding: 0; font: inherit; color: var(--text-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .linkish:hover { color: var(--text); }

  /* --- ekrany dotykowe: cele co najmniej 44 px (zalecenie Androida to 48 dp) --- */
  @media (pointer: coarse) {
    .tabs button, .btn-sm, .seg-sm button, .pay-btn, .log .u, .chips button, .dates button, .toast button, .sync button { min-height: 44px; }

  /* ================= v8: pasek aplikacji, zakładki, ekran Teraz ================= */
  .fab { display: none !important; }

  .ab-in { max-width: 1080px; margin: 0 auto; padding: 8px 16px; min-height: 56px; display: flex; align-items: center; gap: 12px; }
  .ab-title { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; margin-right: auto; }
  .ab-title b { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .ab-title span { font-size: 13px; color: var(--muted); white-space: nowrap; }
  body.syncing .ab-title span::after { content: ', odświeżam…'; }
  .ab-act { display: flex; align-items: center; gap: 4px; }
  .ib { width: 44px; height: 44px; border: 0; border-radius: 50%; background: none; color: var(--text-2); display: grid; place-items: center; cursor: pointer; }
  .ib:hover { background: var(--surface-2); color: var(--text); }
  .ib svg, .tabbar svg, .ab-add svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar circle { fill: currentColor; stroke: none; }
  body.syncing [data-refresh] svg { animation: spin .9s linear infinite; }
  .ab-add { display: none; align-items: center; gap: 6px; border: 0; border-radius: 99px; background: #2a6fd0; color: #fff; font: inherit; font-weight: 700; font-size: 14px; padding: 10px 16px 10px 12px; cursor: pointer; margin-left: 6px; }
  .ab-add:hover { background: #3179dc; }
  .ab-add svg { width: 18px; height: 18px; stroke-width: 2.2; }

  /* zakładki na telefonie: dolny pasek z przyciskiem Dodaj pośrodku */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
    background: rgba(19,28,42,.96); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .tabbar button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 52px; cursor: pointer; }

  .wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

  @media (min-width: 900px) {

    .tabbar button { flex-direction: row; gap: 7px; font-size: 14px; min-height: 40px; padding: 8px 14px; border-radius: 99px; color: var(--text-2); }
    .tabbar button:hover { background: var(--surface-2); color: var(--text); }

  .view > * + * { margin-top: 14px; }

  .month { padding: 6px 2px 4px; }

  .m-stats span { font-size: 13.5px; color: var(--muted); line-height: 1.35; }

  /* płatności: zapłacone zwinięte */

  .limit.st-over .state { color: #ffb0b0; }
  .variant .figures { margin-top: 4px; }
  .seg-sm button { white-space: nowrap; }
  @media (max-width: 640px) {
    .variant .panel-head { flex-direction: column; align-items: stretch; }
    .variant .seg-sm { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 12px; }
  }
  .cols { align-items: start; }

  /* ekran pierwszego połączenia */
  body.setup .tabbar, body.setup .ab-act { display: none !important; }
  body.setup .side { display: none !important; }
  body.setup .layout { display: block; }

  .setup-ico { display: block; width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0,0,0,.4); }
  .setup h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; }

  .dev-acts { display: flex; flex-wrap: wrap; gap: 8px; }

  .pair-box { margin-top: 14px; padding: 16px; border-radius: 14px; background: var(--bg); }
